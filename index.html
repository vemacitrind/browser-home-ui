  <script>
    function updateTime() {
      const now = new Date();
      const day = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
      document.getElementById("time").textContent = `${now.getHours()}:${now.getMinutes()} | ${day[now.getDay()]}`;

      const greeting = now.getHours() < 12 ? "Good morning" : now.getHours() < 18 ? "Good afternoon" : now.getHours() < 23 ? "Good evening" : "Good Night";
      document.getElementById("greeting").textContent = `${greeting}, vemacitrind`;
    }

    setInterval(updateTime, 1000);
    window.onload = updateTime;
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;600;700&display=swap');

      font-family: 'JetBrains Mono', sans-serif;
    }
  </style>
</head>
